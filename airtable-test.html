<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airtable Test — in.house</title>
<style>
body { font-family: monospace; padding: 40px; background: #f0f0f0; }
button { padding: 12px 24px; background: #0d2b3e; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin: 8px 4px; }
button:active { opacity: .8; }
#result { margin-top: 24px; background: white; padding: 20px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; min-height: 60px; border-left: 4px solid #ccc; }
#result.success { border-color: #7ebfb5; }
#result.error { border-color: #e07a5f; }
h2 { color: #0d2b3e; margin-bottom: 16px; }
p { color: #666; margin-bottom: 20px; font-size: .9rem; }
</style>
</head>
<body>
<h2>🔧 Airtable Connection Test</h2>
<p>This page tests if booking.html can connect to Airtable correctly.</p>

<button onclick="testRead()">1. Test READ (fetch records)</button>
<button onclick="testWrite()">2. Test WRITE (send test record)</button>
<button onclick="testDelete()">3. Delete test record</button>

<div id="result">Click a button to test...</div>

<script>
const WORKER = 'https://inhouse-airtable.ian741101.workers.dev';
let lastRecordId = null;

function show(msg, isError) {
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = isError ? 'error' : 'success';
}

async function testRead() {
  show('Reading records via Worker...');
  try {
    const r = await fetch(`${WORKER}/availability?room_type=Ocean%20Double`);
    const data = await r.json();
    if (data.error) {
      show('❌ ERROR:\n' + JSON.stringify(data.error, null, 2), true);
    } else {
      show(`✅ READ OK\n\nBlocked dates for Ocean Double:\n${data.blocked && data.blocked.length ? data.blocked.join('\n') : '(none yet)'}`);
    }
  } catch(e) {
    show('❌ Network error: ' + e.message, true);
  }
}

async function testWrite() {
  show('Writing test record via Worker...');
  try {
    const r = await fetch(`${WORKER}/booking`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        guest_name:    'TEST GUEST',
        guest_contact: 'test@test.com',
        room_type:     'Ocean Double',
        checkin_date:  '2026-06-01',
        checkout_date: '2026-06-03',
        guests:        2,
        notes:         'This is a test record'
      })
    });
    const data = await r.json();
    if (!data.ok) {
      show('❌ ERROR:\n' + JSON.stringify(data.error, null, 2), true);
    } else {
      lastRecordId = data.id;
      show(`✅ WRITE OK — Record created!\nID: ${data.id}\n\nClick "Delete test record" to clean up.`);
    }
  } catch(e) {
    show('❌ Network error: ' + e.message, true);
  }
}

async function testDelete() {
  show('Note: Delete not available via Worker. Manually delete test records in Airtable.');
}
</script>
</body>
</html>
