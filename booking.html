<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂房 | 海廢旅人</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />

  <!-- Flatpickr 日曆 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ocean-deep: #1a3a4a;
      --ocean-mid: #2c5f6e;
      --ocean-light: #4a8fa0;
      --sand: #e8dcc8;
      --sand-light: #f5f0e8;
      --coral: #c97856;
      --foam: #f0ece2;
      --text-dark: #1c2b30;
      --text-mid: #4a5e64;
      --text-light: #8aa0a8;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Serif TC', serif;
      background: var(--sand-light);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(74,143,160,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 100%, rgba(201,120,86,0.08) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* ── 導覽 ── */
    .nav {
      position: sticky; top: 0; z-index: 200;
      background: rgba(245,240,232,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(74,143,160,0.15);
      padding: 16px 32px;
      display: flex; align-items: center; gap: 12px;
    }
    .nav a { text-decoration: none; color: var(--text-mid); font-size: 13px; letter-spacing: 0.05em; transition: color 0.2s; }
    .nav a:hover { color: var(--ocean-mid); }
    .nav-sep { color: var(--text-light); font-size: 11px; }
    .nav-current { color: var(--ocean-deep); font-weight: 500; font-size: 13px; }

    /* ── 英雄 ── */
    .hero { position: relative; z-index: 1; text-align: center; padding: 80px 24px 60px; }
    .hero-label {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 14px; letter-spacing: 0.25em; color: var(--ocean-light); margin-bottom: 16px;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: clamp(36px, 6vw, 56px); color: var(--ocean-deep);
      line-height: 1.2; margin-bottom: 12px; letter-spacing: 0.05em;
    }
    .hero h1 em { font-style: italic; color: var(--coral); }
    .hero-sub { font-size: 14px; color: var(--text-mid); letter-spacing: 0.08em; line-height: 1.8; }

    .wave-divider {
      text-align: center; color: var(--ocean-light);
      opacity: 0.4; font-size: 22px; letter-spacing: 8px; margin: 4px 0 40px;
    }

    /* ── 表單容器 ── */
    .form-wrapper { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 0 24px 100px; }

    .form-card {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 24px; padding: 48px 44px;
      box-shadow: 0 4px 40px rgba(26,58,74,0.08), 0 1px 0 rgba(255,255,255,0.8) inset;
    }

    /* ── 欄位 ── */
    .field-group { margin-bottom: 28px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }

    @media (max-width: 520px) {
      .field-row { grid-template-columns: 1fr; }
      .form-card { padding: 32px 24px; }
    }

    label {
      display: block; font-size: 11px; letter-spacing: 0.18em;
      color: var(--text-mid); text-transform: uppercase; margin-bottom: 8px; font-weight: 500;
    }
    label .req { color: var(--coral); margin-left: 2px; }

    input, select, textarea {
      width: 100%; background: rgba(245,240,232,0.6);
      border: 1px solid rgba(74,143,160,0.2); border-radius: 10px;
      padding: 13px 16px; font-family: 'Noto Serif TC', serif; font-size: 15px;
      color: var(--text-dark); outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--ocean-light);
      background: rgba(255,255,255,0.85);
      box-shadow: 0 0 0 3px rgba(74,143,160,0.12);
    }
    input[readonly] { cursor: pointer; }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 100px; line-height: 1.7; }
    select option { background: white; }

    .section-title {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 18px; color: var(--ocean-mid); margin-bottom: 20px;
      padding-bottom: 8px; border-bottom: 1px solid rgba(74,143,160,0.15); letter-spacing: 0.05em;
    }

    /* ── 日曆狀態提示 ── */
    .calendar-status {
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 12px; font-size: 12px; color: var(--text-mid); letter-spacing: 0.05em;
    }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    .dot-available { background: #5aad8f; }
    .dot-booked { background: #c97856; }

    .cal-loading {
      font-size: 12px; color: var(--ocean-light); letter-spacing: 0.08em;
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .mini-spin {
      width: 12px; height: 12px;
      border: 2px solid rgba(74,143,160,0.3); border-top-color: var(--ocean-light);
      border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
    }

    /* ── Flatpickr 自訂主題 ── */
    .flatpickr-calendar {
      border-radius: 14px !important;
      border: 1px solid rgba(74,143,160,0.2) !important;
      box-shadow: 0 8px 32px rgba(26,58,74,0.15) !important;
      font-family: 'Noto Serif TC', serif !important;
    }
    .flatpickr-day.booked, .flatpickr-day.booked:hover {
      background: rgba(201,120,86,0.15) !important;
      border-color: rgba(201,120,86,0.3) !important;
      color: #c97856 !important;
      text-decoration: line-through; cursor: not-allowed !important;
    }
    .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
      background: var(--ocean-mid) !important; border-color: var(--ocean-mid) !important;
    }
    .flatpickr-day.inRange { background: rgba(74,143,160,0.15) !important; border-color: transparent !important; }
    .flatpickr-months .flatpickr-month {
      background: var(--ocean-deep) !important; color: var(--sand-light) !important;
      border-radius: 14px 14px 0 0 !important;
    }
    .flatpickr-current-month, .flatpickr-current-month .flatpickr-monthDropdown-months, .numInput.cur-year {
      color: var(--sand-light) !important;
    }
    .flatpickr-weekday { color: var(--ocean-light) !important; font-size: 11px !important; }

    /* ── 送出按鈕 ── */
    .submit-btn {
      width: 100%; margin-top: 12px; padding: 17px 32px;
      background: linear-gradient(135deg, var(--ocean-deep) 0%, var(--ocean-mid) 100%);
      color: var(--sand-light); border: none; border-radius: 12px;
      font-family: 'Noto Serif TC', serif; font-size: 15px;
      letter-spacing: 0.18em; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      position: relative; overflow: hidden;
    }
    .submit-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
    }
    .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,58,74,0.25); }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

    /* ── 成功訊息 ── */
    .success-msg { display: none; text-align: center; padding: 40px 24px; }
    .success-icon { font-size: 48px; margin-bottom: 16px; }
    .success-msg h2 {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: 28px; color: var(--ocean-deep); margin-bottom: 10px;
    }
    .success-msg p { color: var(--text-mid); font-size: 14px; line-height: 1.8; }

    /* ── Footer ── */
    .info-strip {
      position: relative; z-index: 1; background: var(--ocean-deep);
      color: rgba(240,236,226,0.8); text-align: center; padding: 40px 24px;
      font-size: 13px; line-height: 2; letter-spacing: 0.06em;
    }
    .info-strip a { color: rgba(240,236,226,0.8); text-decoration: none; }
    .info-strip strong { color: var(--sand); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-up { opacity: 0; transform: translateY(20px); animation: fadeUp 0.6s ease forwards; }
    .fade-up:nth-child(2) { animation-delay: 0.1s; }
    .fade-up:nth-child(3) { animation-delay: 0.2s; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html">海廢旅人</a>
    <span class="nav-sep">›</span>
    <span class="nav-current">訂房預約</span>
  </nav>

  <header class="hero">
    <p class="hero-label fade-up">Booking · 預約住宿</p>
    <h1 class="fade-up">準備好讓<br/><em>海洋</em>療癒你了嗎？</h1>
    <p class="hero-sub fade-up">填寫以下表單，我們將在 1-2 個工作天內與您確認訂房。</p>
  </header>

  <div class="wave-divider">〜 〜 〜</div>

  <div class="form-wrapper">
    <div class="form-card">

      <div class="success-msg" id="successMsg">
        <div class="success-icon">🐚</div>
        <h2>訂房申請已送出！</h2>
        <p>感謝您選擇海廢旅人<br/>確認信已寄送至您的信箱<br/>我們將在 1-2 個工作天內與您聯繫。</p>
      </div>

      <form id="bookingForm" novalidate>

        <p class="section-title">旅人資料</p>

        <div class="field-row">
          <div>
            <label>姓名 <span class="req">*</span></label>
            <input type="text" name="guest_name" placeholder="您的姓名" required />
          </div>
          <div>
            <label>電話 <span class="req">*</span></label>
            <input type="tel" name="guest_phone" placeholder="0912-345-678" required />
          </div>
        </div>

        <div class="field-group">
          <label>Email <span class="req">*</span></label>
          <input type="email" name="guest_email" placeholder="your@email.com" required />
        </div>

        <p class="section-title" style="margin-top:32px;">住宿資訊</p>

        <div class="cal-loading" id="calLoading">
          <span class="mini-spin"></span> 正在載入可用日期⋯
        </div>
        <div class="calendar-status" id="calStatus" style="display:none;">
          <span><span class="status-dot dot-available"></span>可預訂</span>
          <span><span class="status-dot dot-booked"></span>已訂滿（日期變灰並劃線）</span>
        </div>

        <div class="field-row">
          <div>
            <label>入住日期 <span class="req">*</span></label>
            <input type="text" name="checkin_date" id="checkinDate" placeholder="點擊選擇日期" readonly required />
          </div>
          <div>
            <label>退房日期 <span class="req">*</span></label>
            <input type="text" name="checkout_date" id="checkoutDate" placeholder="點擊選擇日期" readonly required />
          </div>
        </div>

        <div class="field-row">
          <div>
            <label>入住人數 <span class="req">*</span></label>
            <select name="guest_count" required>
              <option value="" disabled selected>請選擇</option>
              <option>1 人</option>
              <option>2 人</option>
              <option>3 人</option>
              <option>4 人</option>
              <option>5 人以上</option>
            </select>
          </div>
          <div>
            <label>房型選擇 <span class="req">*</span></label>
            <select name="room_type" required>
              <option value="" disabled selected>請選擇</option>
              <option>海洋大床房</option>
              <option>浪遊雙床房</option>
              <option>剛剛好房（薛之謙主題）</option>
              <option>自由潛水員房</option>
              <option>潮間帶背包客床位</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label>備註需求</label>
          <textarea name="notes" placeholder="例如：帶寵物、需要嬰兒床、過敏需求⋯⋯"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          送出訂房申請
        </button>

      </form>
    </div>
  </div>

  <footer class="info-strip">
    <strong>海廢旅人</strong><br/>
    📍 屏東縣琉球鄉（小琉球）<br/>
    ✉️ <a href="mailto:icebar0413@gmail.com">icebar0413@gmail.com</a><br/>
    <small style="opacity:0.5;font-size:11px;">© 2025 海廢旅人 · 用廢材打造有溫度的旅宿</small>
  </footer>

<script>
// ═══════════════════════════════════════════
//  🔧 填入你的設定值（見下方教學）
// ═══════════════════════════════════════════
const CONFIG = {
  emailjs_public_key:      "QDeBHL3lGEOeqY8VL",
  emailjs_service_id:      "service_qwupc3o",
  emailjs_notify_template: "template_raxaox9",
  emailjs_reply_template:  "template_ej2ejxo",
  gcal_api_key: "AIzaSyD-gETu0w58OZl4TdTvdpK1QVPkUTc-IrU",
  gcal_id:      "4fb79ee0ef48a1069cd7320d150365515828a5850037e06c328030e546d48b49@group.calendar.google.com",
  gas_url:      "https://script.google.com/macros/s/AKfycbyKI_F2L1SJByORLaGOX9vYVOdthVz0Sg-Dcq4Y3dodH_Qsh6d7x5vl1oMrV8IPhfM/exec",
};
// ═══════════════════════════════════════════

emailjs.init(CONFIG.emailjs_public_key);

let bookedDates = [];
let checkinPicker, checkoutPicker;

// ── 1. 從 Google Calendar 抓已訂日期 ─────
async function fetchBookedDates() {
  try {
    const now    = new Date().toISOString();
    const future = new Date(Date.now() + 365 * 86400000).toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/`
      + `${encodeURIComponent(CONFIG.gcal_id)}/events`
      + `?key=${CONFIG.gcal_api_key}`
      + `&timeMin=${now}&timeMax=${future}&singleEvents=true&orderBy=startTime`;

    const res  = await fetch(url);
    const json = await res.json();

    const ranges = (json.items || []).map(ev => ({
      start: (ev.start.date || ev.start.dateTime || '').slice(0, 10),
      end:   (ev.end.date   || ev.end.dateTime   || '').slice(0, 10),
    })).filter(r => r.start && r.end);

    // 展開成每一天的字串陣列
    ranges.forEach(r => {
      const s = new Date(r.start), e = new Date(r.end);
      for (let d = new Date(s); d < e; d.setDate(d.getDate() + 1)) {
        bookedDates.push(d.toISOString().slice(0, 10));
      }
    });

  } catch (err) {
    console.warn('行事曆載入失敗（離線或 API Key 未設定）', err);
  }
}

// ── 2. 初始化 Flatpickr 日曆 ──────────────
async function initCalendars() {
  await fetchBookedDates();

  document.getElementById('calLoading').style.display = 'none';
  document.getElementById('calStatus').style.display  = 'flex';

  const today = new Date().toISOString().slice(0, 10);

  const base = {
    locale: 'zh_tw',
    dateFormat: 'Y-m-d',
    minDate: today,
    disable: [...bookedDates],
    onDayCreate(_d, _s, _fp, dayElem) {
      const ds = dayElem.dateObj.toISOString().slice(0, 10);
      if (bookedDates.includes(ds)) {
        dayElem.classList.add('booked');
        dayElem.title = '此日期已訂滿';
      }
    },
  };

  checkinPicker = flatpickr('#checkinDate', {
    ...base,
    onChange([date]) {
      if (date) {
        const next = new Date(date);
        next.setDate(next.getDate() + 1);
        checkoutPicker.set('minDate', next);
        checkoutPicker.clear();
      }
    },
  });

  checkoutPicker = flatpickr('#checkoutDate', { ...base });
}

initCalendars();

// ── 3. 表單送出 ───────────────────────────
document.getElementById('bookingForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn  = document.getElementById('submitBtn');
  const form = e.target;

  // 簡易驗證
  let valid = true;
  form.querySelectorAll('[required]').forEach(el => {
    el.style.borderColor = '';
    if (!el.value.trim()) { el.style.borderColor = '#c97856'; valid = false; }
  });
  if (!valid) { alert('請填寫所有必填欄位（標示 * 的項目）'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>傳送中⋯';

  const data = {
    guest_name:    form.guest_name.value,
    guest_email:   form.guest_email.value,
    guest_phone:   form.guest_phone.value,
    checkin_date:  form.checkin_date.value,
    checkout_date: form.checkout_date.value,
    guest_count:   form.guest_count.value,
    room_type:     form.room_type.value,
    notes:         form.notes.value || '（無）',
  };

  try {
    // 📧 通知業主
    await emailjs.send(CONFIG.emailjs_service_id, CONFIG.emailjs_notify_template, {
      ...data, owner_email: "icebar0413@gmail.com",
    });

    // 📧 自動回覆客人
    await emailjs.send(CONFIG.emailjs_service_id, CONFIG.emailjs_reply_template, {
      ...data, to_email: data.guest_email,
    });

    // 📅 Google Calendar 建立活動
    await fetch(CONFIG.gas_url, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });

    form.style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';

  } catch (err) {
    console.error(err);
    alert('送出失敗，請稍後再試或直接聯絡我們：icebar0413@gmail.com');
    btn.disabled = false;
    btn.innerHTML = '送出訂房申請';
  }
});
</script>

</body>
</html>
