<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airtable Test — in.house</title>
<style>
body { font-family: monospace; padding: 40px; background: #f0f0f0; }
button { padding: 12px 24px; background: #0d2b3e; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin: 8px 4px; }
button:active { opacity: .8; }
#result { margin-top: 24px; background: white; padding: 20px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; min-height: 60px; border-left: 4px solid #ccc; }
#result.success { border-color: #7ebfb5; }
#result.error { border-color: #e07a5f; }
h2 { color: #0d2b3e; margin-bottom: 16px; }
p { color: #666; margin-bottom: 20px; font-size: .9rem; }
</style>
</head>
<body>
<h2>🔧 Airtable Connection Test</h2>
<p>This page tests if booking.html can connect to Airtable correctly.</p>

<button onclick="testRead()">1. Test READ (fetch records)</button>
<button onclick="testWrite()">2. Test WRITE (send test record)</button>
<button onclick="testDelete()">3. Delete test record</button>

<div id="result">Click a button to test...</div>

<script>
const TOKEN   = 'patDNaErguCCfezR5.783b0684d5c6163da904b144525dce1eeddab0b09757187d19111ffb59f6d8c8';
const BASE_ID = 'app8OqmPIe5o3Wl';
const TABLE   = 'Bookings';
const URL     = `https://api.airtable.com/v0/${BASE_ID}/${TABLE}`;
let lastRecordId = null;

function show(msg, isError) {
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = isError ? 'error' : 'success';
}

async function testRead() {
  show('Reading records...');
  try {
    const r = await fetch(URL, { headers: { Authorization: `Bearer ${TOKEN}` } });
    const data = await r.json();
    if (data.error) {
      show('❌ ERROR:\n' + JSON.stringify(data.error, null, 2), true);
    } else {
      show(`✅ READ OK — Found ${data.records.length} record(s)\n\nFields in first record:\n` +
        (data.records[0] ? JSON.stringify(data.records[0].fields, null, 2) : '(empty table)'));
    }
  } catch(e) {
    show('❌ Network error: ' + e.message, true);
  }
}

async function testWrite() {
  show('Writing test record...');
  try {
    const r = await fetch(URL, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        fields: {
          guest_name:    'TEST GUEST',
          guest_contact: 'test@test.com',
          room_type:     'Ocean Double',
          checkin_date:  '2026-06-01',
          checkout_date: '2026-06-03',
          guests:        2,
          notes:         'This is a test record',
          status:        'Pending'
        }
      })
    });
    const data = await r.json();
    if (data.error) {
      show('❌ ERROR:\n' + JSON.stringify(data.error, null, 2), true);
    } else {
      lastRecordId = data.id;
      show(`✅ WRITE OK — Record created!\nID: ${data.id}\n\nFields written:\n` +
        JSON.stringify(data.fields, null, 2));
    }
  } catch(e) {
    show('❌ Network error: ' + e.message, true);
  }
}

async function testDelete() {
  if (!lastRecordId) { show('⚠️ No test record to delete. Run Test WRITE first.', true); return; }
  show('Deleting test record...');
  try {
    const r = await fetch(`${URL}/${lastRecordId}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${TOKEN}` }
    });
    const data = await r.json();
    if (data.deleted) {
      show(`✅ DELETE OK — Record ${lastRecordId} deleted.`);
      lastRecordId = null;
    } else {
      show('❌ ERROR:\n' + JSON.stringify(data, null, 2), true);
    }
  } catch(e) {
    show('❌ Network error: ' + e.message, true);
  }
}
</script>
</body>
</html>
