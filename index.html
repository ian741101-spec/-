<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>in.house — Xiaoliuqiu B&B</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Noto+Sans+TC:wght@300;400&family=Noto+Sans+JP:wght@300;400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --ocean-deep: #0d2b3e;
  --ocean-mid:  #1a4a6b;
  --seafoam:    #7ebfb5;
  --cream:      #faf7f2;
  --text-light: rgba(255,255,255,.6);
  --safe-top:    env(safe-area-inset-top, 62px);
  --safe-bottom: env(safe-area-inset-bottom, 34px);
  --touch: 52px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { background:#000; overflow:hidden; height:100svh; font-family:'Noto Sans TC','Noto Sans JP',sans-serif; }
button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; cursor:pointer; border:none; }
img { display:block; pointer-events:none; user-select:none; -webkit-user-drag:none; }

/* ── LANGUAGE SWITCHER ── */
.lang-switch {
  position: absolute;
  top: calc(var(--safe-top) + 8px);
  right: 16px;
  z-index: 50;
  display: flex;
  gap: 2px;
  background: rgba(255,255,255,.12);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 100px;
  padding: 3px;
}
.lang-btn {
  background: transparent;
  color: rgba(255,255,255,.7);
  font-size: .68rem;
  letter-spacing: .08em;
  padding: 6px 10px;
  border-radius: 100px;
  font-family: inherit;
  font-weight: 400;
  transition: all .2s;
  min-width: 38px;
}
.lang-btn.active {
  background: white;
  color: var(--ocean-deep);
}
.lang-btn:active { transform: scale(.94); }

/* ── HERO SLIDESHOW ── */
.hero {
  position:relative; width:100%; height:100svh; overflow:hidden;
}
.slides {
  display:flex; height:100%;
  transition:transform .85s cubic-bezier(.77,0,.18,1);
  will-change:transform;
}
.slide { flex:0 0 100%; height:100%; position:relative; }
.slide img { width:100%; height:100%; object-fit:cover; filter:brightness(.52); }

.overlay {
  position:absolute; inset:0;
  background:linear-gradient(to bottom,
    rgba(13,43,62,.25) 0%, transparent 35%,
    transparent 45%, rgba(13,43,62,.75) 100%);
  pointer-events:none;
}

/* ── CONTENT ── */
.content {
  position:absolute; bottom:0; left:0; right:0;
  padding:0 28px calc(52px + var(--safe-bottom));
  display:flex; flex-direction:column;
  align-items:center; text-align:center; gap:6px;
}
.label {
  font-family:'Playfair Display',serif;
  font-style:italic;
  color:var(--seafoam);
  font-size:.76rem; letter-spacing:.3em;
  text-transform:uppercase; opacity:.9;
}
.name {
  font-family:'Dancing Script',cursive;
  font-size:clamp(3.2rem,14vw,5.2rem);
  font-weight:700; color:white; line-height:1;
  text-shadow:0 2px 32px rgba(0,0,0,.4);
  letter-spacing:.04em;
}
.sub {
  font-size:.8rem; color:var(--text-light);
  letter-spacing:.2em; margin-bottom:24px;
}

/* ── NAV BUTTONS ── */
.nav-btns {
  display:flex; gap:10px; width:100%;
}
.btn-primary {
  flex:1.6; height:var(--touch);
  background:white; color:var(--ocean-deep);
  font-size:.8rem; letter-spacing:.16em;
  font-family:'Noto Sans TC','Noto Sans JP',sans-serif; font-weight:400;
  border-radius:2px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  transition:all .2s;
}
.btn-primary:active { transform:scale(.96); opacity:.85; }
.btn-secondary {
  flex:1; height:var(--touch);
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  color:white; border:1px solid rgba(255,255,255,.35);
  font-size:.8rem; letter-spacing:.14em;
  font-family:'Noto Sans TC','Noto Sans JP',sans-serif; font-weight:300;
  border-radius:2px;
  transition:all .2s;
}
.btn-secondary:active { background:rgba(255,255,255,.25); }

/* ── DOTS ── */
.dots {
  position:absolute;
  bottom:calc(160px + var(--safe-bottom));
  left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:10;
}
.dot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(255,255,255,.4);
  transition:all .35s; cursor:pointer;
}
.dot.active { background:white; width:20px; border-radius:3px; }

/* ── PROGRESS BAR ── */
.progress {
  position:absolute; bottom:0; left:0;
  height:2px; background:var(--seafoam);
  width:0%; transition:width linear; z-index:10;
}

/* ── SCROLL HINT ── */
.scroll-hint {
  position:absolute;
  bottom:calc(18px + var(--safe-bottom));
  left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column;
  align-items:center; gap:3px;
  opacity:.5; animation:bounce 2.2s infinite;
  cursor:pointer;
}
.scroll-hint span { font-size:.62rem; letter-spacing:.18em; color:white; }
@keyframes bounce {
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(7px)}
}

/* ── DYNAMIC ISLAND SAFE ── */
.top-safe {
  position:absolute; top:0; left:0; right:0;
  height:calc(var(--safe-top) + 16px);
  pointer-events:none;
}
</style>
</head>
<body>

<!-- LANGUAGE SWITCHER -->
<div class="lang-switch">
  <button class="lang-btn" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="zh">繁中</button>
  <button class="lang-btn" data-lang="ja">日本語</button>
</div>

<div class="hero" id="hero">
  <div class="slides" id="slides">
    <div class="slide"><img src="images/LINE_NOTE_260425_14.jpg" alt="in.house — Front Garden" loading="eager"></div>
    <div class="slide"><img src="images/LINE_NOTE_260425_16.jpg" alt="in.house — Ocean Double Room" loading="lazy"></div>
    <div class="slide"><img src="images/LINE_NOTE_260425_17.jpg" alt="in.house — Lobby" loading="lazy"></div>
    <div class="slide"><img src="images/LINE_NOTE_260425_15.jpg" alt="in.house — Balcony" loading="lazy"></div>
    <div class="slide"><img src="images/LINE_NOTE_260425_1.jpg" alt="in.house — Dive Gear" loading="lazy"></div>
  </div>

  <div class="overlay"></div>
  <div class="top-safe"></div>

  <div class="dots" id="dots">
    <span class="dot active" onclick="goTo(0)"></span>
    <span class="dot" onclick="goTo(1)"></span>
    <span class="dot" onclick="goTo(2)"></span>
    <span class="dot" onclick="goTo(3)"></span>
    <span class="dot" onclick="goTo(4)"></span>
  </div>

  <div class="content">
    <div class="label" data-i18n="label">Xiaoliuqiu · Taiwan</div>
    <h1 class="name">in.house</h1>
    <p class="sub" data-i18n="sub">小琉球 · B&B</p>
    <div class="nav-btns">
      <button class="btn-primary" data-i18n="bookNow" onclick="location.href='booking.html'">Book Now</button>
      <button class="btn-secondary" data-i18n="ourRooms" onclick="location.href='rooms.html'">Our Rooms</button>
    </div>
  </div>

  <div class="progress" id="progress"></div>

  <div class="scroll-hint" onclick="location.href='rooms.html'">
    <span data-i18n="explore">Explore</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </div>
</div>

<script>
/* ── i18n DICTIONARY ── */
const i18n = {
  en: {
    title:    'in.house — Xiaoliuqiu B&B',
    label:    'Xiaoliuqiu · Taiwan',
    sub:      'Xiaoliuqiu · B&B',
    bookNow:  'Book Now',
    ourRooms: 'Our Rooms',
    explore:  'Explore',
  },
  zh: {
    title:    'in.house — 小琉球',
    label:    '小琉球 · 台灣',
    sub:      '小琉球',
    bookNow:  '立即訂房',
    ourRooms: '房型介紹',
    explore:  '了解更多',
  },
  ja: {
    title:    'in.house — 小琉球ゲストハウス',
    label:    '小琉球 · 台湾',
    sub:      '小琉球 · ゲストハウス',
    bookNow:  '今すぐ予約',
    ourRooms: '客室紹介',
    explore:  'もっと見る',
  }
};

/* ── LANGUAGE SWITCHER LOGIC ── */
function detectLang() {
  const saved = localStorage.getItem('lang');
  if (saved && i18n[saved]) return saved;
  const browser = (navigator.language || 'en').toLowerCase();
  if (browser.startsWith('zh')) return 'zh';
  if (browser.startsWith('ja')) return 'ja';
  return 'en';
}

function applyLang(lang) {
  if (!i18n[lang]) lang = 'en';
  const dict = i18n[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-TW' : lang;
  document.title = dict.title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  localStorage.setItem('lang', lang);
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

applyLang(detectLang());

/* ── HERO SLIDESHOW ── */
(function() {
  const slides = document.getElementById('slides');
  const dots   = document.querySelectorAll('.dot');
  const bar    = document.getElementById('progress');
  const TOTAL  = 5, DELAY = 4200;
  let cur = 0, timer, startX = 0, moved = false;

  function goTo(i) {
    cur = (i + TOTAL) % TOTAL;
    slides.style.transform = `translateX(${-cur * 100}%)`;
    dots.forEach((d,idx) => d.classList.toggle('active', idx === cur));
    bar.style.transition = 'none'; bar.style.width = '0%';
    requestAnimationFrame(() => {
      bar.style.transition = `width ${DELAY}ms linear`;
      bar.style.width = '100%';
    });
  }

  window.goTo = goTo;
  function auto() { clearInterval(timer); timer = setInterval(() => goTo(cur+1), DELAY); }

  const hero = document.getElementById('hero');
  hero.addEventListener('touchstart', e => { startX = e.touches[0].clientX; moved = false; clearInterval(timer); }, {passive:true});
  hero.addEventListener('touchmove',  e => { moved = Math.abs(e.touches[0].clientX - startX) > 8; }, {passive:true});
  hero.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (moved && Math.abs(dx) > 40) goTo(dx < 0 ? cur+1 : cur-1);
    auto();
  });

  goTo(0); auto();
})();
</script>
</body>
</html>
